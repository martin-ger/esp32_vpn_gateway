dependencies:
  # WireGuard client and server; the server API is built with
  # CONFIG_WIREGUARD_SERVER, which CONFIG_WG_SERVER selects
  esp_wireguard:
    git: https://github.com/martin-ger/esp_wireguard_idf_5.5.x.git
    version: v0.10.0
  espressif/led_strip: '*'
  espressif/mdns:
    version: '*'
    rules:
      - if: "idf_target != \"esp32c5\""
  # QR code for WireGuard server client configs (only the chips that have a
  # server: esp32s3, and esp32 for the WiFi, WT32-ETH01 and POE-ISO builds)
  espressif/qrcode:
    version: '*'
    rules:
      - if: "target in [esp32, esp32s3]"
